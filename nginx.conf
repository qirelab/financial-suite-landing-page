server {
    listen 80;
    server_name f-suite.com www.f-suite.com;

    root /var/www/f-suite-landing/build;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Contact form API (server/index.mjs, pm2 app f-suite-api)
    location /api/ {
        proxy_pass http://127.0.0.1:1804;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    error_log /var/log/nginx/f-suite.error.log;
    access_log /var/log/nginx/f-suite.access.log;
}
